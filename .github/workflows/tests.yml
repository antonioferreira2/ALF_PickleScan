name: Testes

# Corre os testes em Windows e Linux, em cada push e pull request.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar os módulos
        run: python -m py_compile ALF_picklescan.py ALF_picklescan_gui.py i18n.py

      - name: Correr os testes
        run: python -m unittest discover -s tests -v
