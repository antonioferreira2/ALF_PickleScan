name: Build e release

# Corre ao enviar uma tag de versão (ex.: v2.1.0) ou manualmente.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Necessárias para atestar a origem dos executáveis (GitHub Artifact
  # Attestations): o comprovativo assinado liga o ficheiro ao workflow e ao commit.
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Gerar o executável Windows
        run: python -m PyInstaller --onefile --windowed --name ALF_picklescan --clean --collect-all picklescan ALF_picklescan_gui.py

      - name: Renomear e calcular o SHA-256
        shell: pwsh
        run: |
          Move-Item dist\ALF_picklescan.exe dist\ALF_picklescan-windows-x64.exe
          $hash = (Get-FileHash dist\ALF_picklescan-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ALF_picklescan-windows-x64.exe" | Out-File -Encoding ascii dist\ALF_picklescan-windows-x64.exe.sha256

      - name: Atestar a origem do executável
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/ALF_picklescan-windows-x64.exe

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ALF_picklescan-windows
          path: |
            dist/ALF_picklescan-windows-x64.exe
            dist/ALF_picklescan-windows-x64.exe.sha256

  build-linux:
    # Ubuntu 22.04 (glibc 2.35): o binário corre em Ubuntu 22.04+, Debian 12,
    # Fedora 36+, Linux Mint 21+ e outras distribuições com glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Python e tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # Python 3.11 do setup-python (o picklescan 1.0.5 exige >= 3.11; o python3
      # do Ubuntu 22.04 é 3.10), mantendo a glibc 2.35 do sistema.
      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Gerar o executável Linux
        run: python -m PyInstaller --onefile --name ALF_picklescan --clean --collect-all picklescan ALF_picklescan_gui.py

      - name: Renomear e calcular o SHA-256
        run: |
          cd dist
          mv ALF_picklescan ALF_picklescan-linux-x86_64
          sha256sum ALF_picklescan-linux-x86_64 > ALF_picklescan-linux-x86_64.sha256

      - name: Atestar a origem do executável
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/ALF_picklescan-linux-x86_64

      # Abre a interface num ecrã virtual. Se o executável arrancar e continuar a
      # correr, o timeout mata-o e devolve 124. Qualquer outro código é falha.
      - name: Testar o arranque do executável (xvfb)
        run: |
          sudo apt-get install -y xvfb
          set +e
          xvfb-run -a timeout 15 ./dist/ALF_picklescan-linux-x86_64
          code=$?
          echo "código de saída: $code"
          if [ "$code" -ne 124 ]; then
            echo "O executável não ficou a correr. Esperado 124 (timeout)."
            exit 1
          fi
          echo "GUI arrancou e manteve-se estável durante 15 s."

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ALF_picklescan-linux
          path: |
            dist/ALF_picklescan-linux-x86_64
            dist/ALF_picklescan-linux-x86_64.sha256

  publicar:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Obter os artefactos
        uses: actions/download-artifact@v8
        with:
          path: artefactos
          merge-multiple: true

      - name: Publicar na release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artefactos/ALF_picklescan-windows-x64.exe
            artefactos/ALF_picklescan-windows-x64.exe.sha256
            artefactos/ALF_picklescan-linux-x86_64
            artefactos/ALF_picklescan-linux-x86_64.sha256
          generate_release_notes: true
